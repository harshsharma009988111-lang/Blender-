name: Build Blender Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Android Alpha source
        uses: actions/checkout@v4
        with:
          ref: android-alpha-1
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            git-lfs \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            build-essential \
            pkg-config \
            meson \
            patchelf \
            zip \
            unzip \
            curl \
            wget \
            openjdk-17-jdk \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libwayland-dev

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;28.2.13676358"

      - name: Set Android environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Show source information
        run: |
          echo "Branch:"
          git branch --show-current

          echo "Commit:"
          git log -1 --oneline

      - name: Restore official startup.blend
        shell: bash
        run: |
          set -e

          mkdir -p release/datafiles

          echo "Downloading official Blender startup.blend..."

          curl -fL \
            "https://media.githubusercontent.com/media/blender/blender/main/release/datafiles/startup.blend" \
            -o release/datafiles/startup.blend

          echo "startup.blend downloaded."

      - name: Verify startup.blend
        shell: bash
        run: |
          set -e

          FILE="release/datafiles/startup.blend"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: startup.blend was not downloaded."
            exit 1
          fi

          SIZE=$(stat -c%s "$FILE")
          SHA=$(sha256sum "$FILE" | cut -d' ' -f1)

          echo "startup.blend size: $SIZE"
          echo "startup.blend SHA256: $SHA"

          EXPECTED_SIZE="121384"
          EXPECTED_SHA="1335899143c7e77bcb0f6e3680fd99078c0af481a1238e4ed7d4eb1ddd7dd353"

          if [ "$SIZE" != "$EXPECTED_SIZE" ]; then
            echo "ERROR: Wrong startup.blend size."
            exit 1
          fi

          if [ "$SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: Wrong startup.blend SHA256."
            exit 1
          fi

          echo "SUCCESS: startup.blend verified."

      - name: Apply GPU storage buffer fix
        shell: bash
        run: |
          set -e

          FILE="source/blender/gpu/intern/gpu_storage_buffer.cc"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: GPU storage buffer source file not found."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          path = Path("source/blender/gpu/intern/gpu_storage_buffer.cc")
          text = path.read_text()

          old = """void GPU_storagebuf_update(gpu::StorageBuf *ssbo, const void *data)
          {
            ssbo->update(data);
          }"""

          new = """void GPU_storagebuf_update(gpu::StorageBuf *ssbo, const void *data)
          {
            if (ssbo == nullptr) {
              return;
            }

            ssbo->update(data);
          }"""

          if new in text:
              print("GPU storage buffer fix is already present.")

          elif old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("GPU storage buffer fix applied successfully.")

          else:
              print("ERROR: Expected GPU_storagebuf_update function was not found.")
              raise SystemExit(1)
          PY

      - name: Verify GPU storage buffer fix
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path("source/blender/gpu/intern/gpu_storage_buffer.cc")
          text = path.read_text()

          marker = "void GPU_storagebuf_update"
          start = text.find(marker)

          if start == -1:
              print("ERROR: GPU_storagebuf_update was not found.")
              raise SystemExit(1)

          end = text.find("\n}", start)

          if end == -1:
              print("ERROR: Could not read GPU_storagebuf_update.")
              raise SystemExit(1)

          function = text[start:end + 2]

          print("GPU_storagebuf_update:")
          print(function)

          if "if (ssbo == nullptr)" not in function:
              print("ERROR: Null-pointer guard was not applied.")
              raise SystemExit(1)

          print("SUCCESS: GPU storage buffer fix verified.")
          PY

      - name: Configure Android environment
        shell: bash
        run: |
          set -e

          source build_files/android/env.sh

          echo "ANDROID_ABI=$ANDROID_ABI" >> "$GITHUB_ENV"
          echo "ANDROID_API=$ANDROID_API" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN_FILE=$ANDROID_TOOLCHAIN_FILE" >> "$GITHUB_ENV"

          echo "Android ABI: $ANDROID_ABI"
          echo "Android API: $ANDROID_API"
          echo "Android NDK: $ANDROID_NDK_HOME"

      - name: Build Android dependencies
        shell: bash
        run: |
          set -e

          echo "Building Blender Android dependencies..."

          mkdir -p ../blender_build_android/lib/android_arm64

          chmod +x build_files/android/deps/build.sh

          build_files/android/deps/build.sh all

      - name: Build Blender Android APK
        shell: bash
        run: |
          set -e

          chmod +x build_files/android/build_apk.sh

          build_files/android/build_apk.sh lite

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for generated APK..."

          find .. -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blender-android-modified
          path: |
            ../blender_build_android/**/*.apk
          if-no-files-found: error
          retention-days: 7
