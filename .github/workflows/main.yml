name: Build Blender Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Android Alpha source
        uses: actions/checkout@v4
        with:
          ref: android-alpha-1
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            git-lfs \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            build-essential \
            pkg-config \
            meson \
            patchelf \
            zip \
            unzip \
            curl \
            wget \
            openjdk-17-jdk \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libwayland-dev

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;28.2.13676358"

      - name: Set Android environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Restore startup.blend from Android Alpha APK
        shell: bash
        run: |
          set -e

          APK="/tmp/blender-lite.apk"
          APK_DIR="/tmp/blender_apk"
          RUNTIME="/tmp/runtime"

          echo "Downloading Android Alpha lite APK..."

          curl -fL \
            "https://github.com/simfeo/blender/releases/download/android-alpha-1/blender-lite.apk" \
            -o "$APK"

          echo "APK downloaded."

          rm -rf "$APK_DIR" "$RUNTIME"
          mkdir -p "$APK_DIR" "$RUNTIME"

          echo "Extracting blender_runtime.zip..."

          unzip -q "$APK" \
            "assets/blender_runtime.zip" \
            -d "$APK_DIR"

          if [ ! -f "$APK_DIR/assets/blender_runtime.zip" ]; then
            echo "ERROR: blender_runtime.zip was not found in the APK."
            exit 1
          fi

          echo "Extracting runtime..."

          unzip -q \
            "$APK_DIR/assets/blender_runtime.zip" \
            -d "$RUNTIME"

          echo "Searching for startup.blend..."

          STARTUP=$(find "$RUNTIME" -type f -name "startup.blend" -print -quit)

          if [ -z "$STARTUP" ]; then
            echo "ERROR: startup.blend was not found."
            exit 1
          fi

          echo "Found startup.blend:"
          echo "$STARTUP"

          mkdir -p release/datafiles

          cp "$STARTUP" release/datafiles/startup.blend

          echo "startup.blend restored."

      - name: Verify startup.blend
        shell: bash
        run: |
          set -e

          SIZE=$(stat -c%s release/datafiles/startup.blend)
          SHA=$(sha256sum release/datafiles/startup.blend | awk '{print $1}')

          echo "startup.blend size: $SIZE"
          echo "startup.blend SHA256: $SHA"

          if [ "$SIZE" != "121384" ]; then
            echo "ERROR: Wrong startup.blend size."
            exit 1
          fi

          if [ "$SHA" != "1335899143c7e77cb0f6e3680fd99078c0af481a1238e4ed7d4eb1ddd7dd353" ]; then
            echo "ERROR: Wrong startup.blend SHA256."
            exit 1
          fi

          echo "startup.blend verification PASSED."

      - name: Apply GPU storage buffer fix
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path("source/blender/gpu/intern/gpu_storage_buffer.cc")
          text = path.read_text()

          old = """void GPU_storagebuf_update(gpu::StorageBuf *ssbo, const void *data)
          {
            ssbo->update(data);
          }"""

          new = """void GPU_storagebuf_update(gpu::StorageBuf *ssbo, const void *data)
          {
            if (ssbo == nullptr) {
              return;
            }

            ssbo->update(data);
          }"""

          if new in text:
              print("GPU storage buffer fix already present.")
          elif old in text:
              path.write_text(text.replace(old, new, 1))
              print("GPU storage buffer fix applied.")
          else:
              print("ERROR: GPU_storagebuf_update function was not found.")
              raise SystemExit(1)
          PY

      - name: Configure Android environment
        run: |
          source build_files/android/env.sh

          echo "ANDROID_ABI=$ANDROID_ABI" >> "$GITHUB_ENV"
          echo "ANDROID_API=$ANDROID_API" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN_FILE=$ANDROID_TOOLCHAIN_FILE" >> "$GITHUB_ENV"

      - name: Build Android dependencies
        run: |
          mkdir -p ../blender_build_android/lib/android_arm64

          chmod +x build_files/android/deps/build.sh

          build_files/android/deps/build.sh all

      - name: Build Blender Android APK
        run: |
          chmod +x build_files/android/build_apk.sh

          build_files/android/build_apk.sh lite

      - name: Find APK
        run: |
          echo "Generated APK files:"
          find .. -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blender-android-modified
          path: |
            ../blender_build_android/**/*.apk
          if-no-files-found: error
          retention-days: 7
