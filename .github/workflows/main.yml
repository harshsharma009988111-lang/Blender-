name: Build Blender Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Android Alpha source
        uses: actions/checkout@v4
        with:
          ref: android-alpha-1
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            git-lfs \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            build-essential \
            pkg-config \
            meson \
            patchelf \
            zip \
            unzip \
            curl \
            wget \
            openjdk-17-jdk \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libwayland-dev

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;28.2.13676358"

      - name: Set Android environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Restore exact startup.blend
        shell: bash
        run: |
          set -e

          FILE="release/datafiles/startup.blend"
          EXPECTED_SHA="1335899143c7e77cb0f6e3680fd99078c0af481a1238e4ed7d4eb1ddd7dd353"
          EXPECTED_SIZE="121384"

          echo "Downloading exact Blender startup.blend..."

          mkdir -p release/datafiles

          curl -fL \
            "https://media.githubusercontent.com/media/blender/blender/main/release/datafiles/startup.blend" \
            -o "${FILE}.real"

          ACTUAL_SIZE=$(stat -c%s "${FILE}.real")
          ACTUAL_SHA=$(sha256sum "${FILE}.real" | awk '{print $1}')

          echo "Downloaded size: ${ACTUAL_SIZE}"
          echo "Downloaded SHA256: ${ACTUAL_SHA}"

          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ]; then
            echo "ERROR: startup.blend has wrong size."
            exit 1
          fi

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: startup.blend has wrong SHA256."
            exit 1
          fi

          mv "${FILE}.real" "$FILE"

          echo "Exact startup.blend restored successfully."

      - name: Verify startup.blend
        run: |
          SIZE=$(stat -c%s release/datafiles/startup.blend)
          SHA=$(sha256sum release/datafiles/startup.blend | awk '{print $1}')

          echo "startup.blend size: $SIZE"
          echo "startup.blend SHA256: $SHA"

          test "$SIZE" = "121384"
          test "$SHA" = "1335899143c7e77cb0f6e3680fd99078c0af481a1238e4ed7d4eb1ddd7dd353"

          echo "startup.blend verification PASSED."

      - name: Apply GPU storage buffer fix
        shell: bash
        run: |
          set -e

          FILE="source/blender/gpu/intern/gpu_storage_buffer.cc"

          python3 <<'PY'
          from pathlib import Path

          path = Path("source/blender/gpu/intern/gpu_storage_buffer.cc")
          text = path.read_text()

          old = """void GPU_storagebuf_update(gpu::StorageBuf *ssbo, const void *data)
          {
            ssbo->update(data);
          }"""

          new = """void GPU_storagebuf_update(gpu::StorageBuf *ssbo, const void *data)
          {
            if (ssbo == nullptr) {
              return;
            }

            ssbo->update(data);
          }"""

          if new in text:
              print("GPU storage buffer fix already present.")
          elif old in text:
              path.write_text(text.replace(old, new, 1))
              print("GPU storage buffer fix applied.")
          else:
              print("ERROR: Expected function was not found.")
              raise SystemExit(1)
          PY

      - name: Configure Android environment
        run: |
          source build_files/android/env.sh

          echo "ANDROID_ABI=$ANDROID_ABI" >> "$GITHUB_ENV"
          echo "ANDROID_API=$ANDROID_API" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN_FILE=$ANDROID_TOOLCHAIN_FILE" >> "$GITHUB_ENV"

          echo "ABI: $ANDROID_ABI"
          echo "API: $ANDROID_API"
          echo "NDK: $ANDROID_NDK_HOME"

      - name: Build Android dependencies
        run: |
          mkdir -p ../blender_build_android/lib/android_arm64

          chmod +x build_files/android/deps/build.sh

          build_files/android/deps/build.sh all

      - name: Build Blender Android APK
        run: |
          chmod +x build_files/android/build_apk.sh

          build_files/android/build_apk.sh lite

      - name: Find APK
        run: |
          echo "Searching for generated APK..."

          find .. -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blender-android-modified
          path: |
            ../blender_build_android/**/*.apk
          if-no-files-found: error
          retention-days: 7
