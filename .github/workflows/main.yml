name: Build Blender Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Android Alpha source
        uses: actions/checkout@v4
        with:
          ref: android-alpha-1
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            git-lfs \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            build-essential \
            pkg-config \
            meson \
            patchelf \
            zip \
            unzip \
            curl \
            wget \
            openjdk-17-jdk \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libwayland-dev

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;28.2.13676358"

      - name: Set Android environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Show source information
        run: |
          echo "Branch:"
          git branch --show-current

          echo "Commit:"
          git log -1 --oneline

          echo "Git LFS files:"
          git lfs ls-files | head -20 || true

      - name: Prepare startup.blend
        shell: bash
        run: |
          set -e

          FILE="release/datafiles/startup.blend"

          echo "Checking $FILE"

          if [ -f "$FILE" ]; then
            SIZE=$(wc -c < "$FILE")
            echo "startup.blend exists."
            echo "Size: $SIZE bytes"

            if [ "$SIZE" -gt 10000 ]; then
              echo "startup.blend appears to be a real Blender file."
              exit 0
            fi

            echo "startup.blend is only an LFS pointer."
          else
            echo "startup.blend does not exist."
          fi

          echo ""
          echo "The Android Alpha source is missing its startup.blend LFS object."
          echo "Trying to obtain the file from the Android Alpha release APK."

          mkdir -p /tmp/blender_apk
          cd /tmp/blender_apk

          curl -L \
            --fail \
            --retry 3 \
            -o blender-lite.apk \
            "https://github.com/simfeo/blender/releases/download/android-alpha-1/blender-lite.apk"

          echo "APK downloaded."

          unzip -l blender-lite.apk | grep -i "startup.blend" || true

          mkdir -p extracted
          unzip -q blender-lite.apk -d extracted

          FOUND=$(find extracted -type f -iname "startup.blend" | head -1)

          if [ -z "$FOUND" ]; then
            echo ""
            echo "ERROR: startup.blend was not found inside the release APK."
            echo ""
            echo "Files containing 'blend' found in APK:"
            find extracted -type f | grep -i "blend" | head -50 || true
            exit 1
          fi

          echo "Found startup.blend:"
          echo "$FOUND"

          cp "$FOUND" "$GITHUB_WORKSPACE/release/datafiles/startup.blend"

          SIZE=$(wc -c < "$GITHUB_WORKSPACE/release/datafiles/startup.blend")

          echo "Copied startup.blend
