name: Build Blender Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      - name: Checkout Android Alpha source
        env:
          GIT_LFS_SKIP_SMUDGE: 1
        uses: actions/checkout@v4
        with:
          repository: simfeo/blender
          ref: android-alpha-1
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            git-lfs \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            build-essential \
            pkg-config \
            meson \
            patchelf \
            zip \
            unzip \
            curl \
            wget \
            openjdk-17-jdk \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libwayland-dev

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;28.2.13676358"

      - name: Set Android environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Prepare source
        run: |
          git status
          git log -1 --oneline

      - name: Apply diagnostic logging
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("source/blender/gpu/intern/gpu_storage_buffer.cc")
          text = path.read_text()

          if '#include <android/log.h>' not in text:
              text = text.replace(
                  '#include <cstring>',
                  '#include <cstring>\n\n#ifdef __ANDROID__\n#  include <android/log.h>\n#  define LOG_DIAG(...) __android_log_print(ANDROID_LOG_ERROR, "BLENDER_DIAGNOSTIC", __VA_ARGS__)\n#else\n#  include <cstdio>\n#  define LOG_DIAG(...) std::printf(__VA_ARGS__)\n#endif',
                  1
              )

          old = """gpu::StorageBuf *GPU_storagebuf_create_ex(size_t size,
                                          const void *data,
                                          GPUUsageType usage,
                                          const char *name)
{
  StorageBuf *ssbo = GPUBackend::get()->storagebuf_alloc(size, usage, name);
"""

          new = """gpu::StorageBuf *GPU_storagebuf_create_ex(size_t size,
                                          const void *data,
                                          GPUUsageType usage,
                                          const char *name)
{
  LOG_DIAG("[BLENDER DIAGNOSTIC] GPU_storagebuf_create_ex(size=%zu, name='%s') called",
           size,
           name ? name : "unnamed");

  if (!GPU_storage_buffer_support()) {
    LOG_DIAG("[BLENDER DIAGNOSTIC] Storage buffer support = FALSE");
    return nullptr;
  }

  LOG_DIAG("[BLENDER DIAGNOSTIC] Storage buffer support = TRUE");

  StorageBuf *ssbo = GPUBackend::get()->storagebuf_alloc(size, usage, name);

  if (ssbo == nullptr) {
    LOG_DIAG("[BLENDER DIAGNOSTIC] storagebuf_alloc() returned NULL");
    return nullptr;
  }

  LOG_DIAG("[BLENDER DIAGNOSTIC] storagebuf_alloc() succeeded: %p", ssbo);
"""

          if new not in text:
              if old not in text:
                  print("ERROR: GPU_storagebuf_create_ex() layout did not match.")
                  raise SystemExit(1)

              text = text.replace(old, new, 1)

          path.write_text(text)
          print("Diagnostic logging patch applied.")
          PY

      - name: Configure Android environment
        run: |
          source build_files/android/env.sh

          echo "ANDROID_ABI=$ANDROID_ABI" >> "$GITHUB_ENV"
          echo "ANDROID_API=$ANDROID_API" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN_FILE=$ANDROID_TOOLCHAIN_FILE" >> "$GITHUB_ENV"

          echo "ABI: $ANDROID_ABI"
          echo "API: $ANDROID_API"
          echo "NDK: $ANDROID_NDK_HOME"

      - name: Build Android dependencies
        run: |
          chmod +x build_files/android/deps/build.sh
          build_files/android/deps/build.sh all

      - name: Build Blender Android APK
        run: |
          chmod +x build_files/android/build_apk.sh
          build_files/android/build_apk.sh lite

      - name: Find APK
        run: |
          echo "Searching for generated APK..."
          find .. -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blender-android-diagnostic
          path: |
            ../blender_build_android/**/*.apk
          if-no-files-found: error
          retention-days: 7
