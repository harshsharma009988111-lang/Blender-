name: Build Blender Android Diagnostic APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Android Alpha source
        uses: actions/checkout@v4
        with:
          ref: android-alpha-1
          fetch-depth: 1
          submodules: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            git-lfs \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            build-essential \
            pkg-config \
            meson \
            patchelf \
            zip \
            unzip \
            curl \
            wget \
            openjdk-17-jdk \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libwayland-dev

      - name: Enable Git LFS
        run: |
          git lfs install

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;28.2.13676358"

      - name: Set Android environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Prepare source
        run: |
          git status
          git branch --show-current
          git log -1 --oneline

      - name: Apply diagnostic null-pointer fix
        shell: bash
        run: |
          set -e

          FILE="source/blender/gpu/intern/gpu_storage_buffer.cc"

          echo "Checking GPU storage buffer source..."

          if [ ! -f "$FILE" ]; then
            echo "ERROR: File not found:"
            echo "$FILE"
            exit 1
          fi

          echo "Found:"
          echo "$FILE"

          python3 <<'PY'
          from pathlib import Path

          path = Path("source/blender/gpu/intern/gpu_storage_buffer.cc")
          text = path.read_text()

          old = """void GPU_storagebuf_update(gpu::StorageBuf *ssbo, const void *data)
          {
            ssbo->update(data);
          }"""

          new = """void GPU_storagebuf_update(gpu::StorageBuf *ssbo, const void *data)
          {
            if (ssbo == nullptr) {
              return;
            }

            ssbo->update(data);
          }"""

          if new in text:
              print("Diagnostic null-pointer guard is already present.")
          elif old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("Diagnostic null-pointer guard applied successfully.")
          else:
              print("ERROR: Expected GPU_storagebuf_update function was not found.")
              print()
              print("The actual function found in the source is:")
              
              marker = "void GPU_storagebuf_update"
              start = text.find(marker)

              if start != -1:
                  end = text.find("\n}", start)
                  if end != -1:
                      print(text[start:end + 2])
                  else:
                      print(text[start:start + 500])
              else:
                  print("GPU_storagebuf_update was not found at all.")

              raise SystemExit(1)
          PY

      - name: Verify diagnostic patch
        run: |
          echo "Checking patched function..."

          python3 <<'PY'
          from pathlib import Path

          path = Path("source/blender/gpu/intern/gpu_storage_buffer.cc")
          text = path.read_text()

          marker = "void GPU_storagebuf_update"

          start = text.find(marker)

          if start == -1:
              print("ERROR: GPU_storagebuf_update not found.")
              raise SystemExit(1)

          end = text.find("\n}", start)

          if end == -1:
              print("ERROR: Could not read function.")
              raise SystemExit(1)

          function = text[start:end + 2]

          print("Actual function after patch:")
          print("--------------------------------")
          print(function)
          print("--------------------------------")

          if "if (ssbo == nullptr)" not in function:
              print("ERROR: Null-pointer guard was NOT applied.")
              raise SystemExit(1)

          print("SUCCESS: Null-pointer guard verified.")
          PY

      - name: Configure Android environment
        run: |
          source build_files/android/env.sh

          echo "ANDROID_ABI=$ANDROID_ABI" >> "$GITHUB_ENV"
          echo "ANDROID_API=$ANDROID_API" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN_FILE=$ANDROID_TOOLCHAIN_FILE" >> "$GITHUB_ENV"

          echo "Android ABI: $ANDROID_ABI"
          echo "Android API: $ANDROID_API"
          echo "NDK: $ANDROID_NDK_HOME"

      - name: Build Android dependencies
        run: |
          echo "Building Blender Android dependencies."
          echo "This may take a long time."

          mkdir -p ../blender_build_android/lib/android_arm64

          chmod +x build_files/android/deps/build.sh

          build_files/android/deps/build.sh all

      - name: Build diagnostic Blender APK
        run: |
          chmod +x build_files/android/build_apk.sh

          build_files/android/build_apk.sh lite

      - name: Find generated APK
        run: |
          echo "Searching for APK files..."

          find .. -type f -name "*.apk" -print

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: blender-5.3-android-diagnostic-lite
          path: |
            ../blender_build_android/**/*.apk
          if-no-files-found: error
          retention-days: 7
